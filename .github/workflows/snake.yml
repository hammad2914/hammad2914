name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # colours match the header: navy empty days, blue to cyan as activity rises
          outputs: |
            dist/github-snake.svg?color_snake=#1D4ED8&color_dots=#EEF2F7,#BAE6FD,#7DD3FC,#38BDF8,#0284C7
            dist/github-snake-dark.svg?color_snake=#22D3EE&color_dots=#161E2E,#0C3A5E,#1D4ED8,#0EA5E9,#67E8F9

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
